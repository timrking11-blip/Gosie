name: Gosie web checks

on:
  pull_request:
    paths:
      - "artifacts/gosie/**"
      - "artifacts/api-server/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/gosie-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gosie-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install locked web dependencies
        run: pnpm --filter @workspace/gosie... install --frozen-lockfile
      - name: Load configured build environment
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          manifest = Path("artifacts/gosie/.replit-artifact/artifact.toml")
          env = tomllib.loads(manifest.read_text())["services"][0]["env"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for name in ("PORT", "BASE_PATH"):
                  output.write(f"{name}={env[name]}\n")
          PY
      - name: Typecheck
        run: pnpm --filter @workspace/gosie typecheck
      - name: Existing and compatibility tests
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/gosie test
      - name: Configured production build
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/gosie build
      - name: API server isolation and auth tests
        if: ${{ !cancelled() }}
        working-directory: artifacts/api-server
        env:
          DB_PATH: ${{ runner.temp }}/api-test.db
          PORT: "8791"
          AUTH_RATE_LIMIT: "1000"
        run: |
          node server.js &
          sleep 2
          node test-b1.js | tee test.log
          ! grep -q '^FAIL' test.log
      - name: Hardening tests (API and mobile static server)
        if: ${{ !cancelled() }}
        run: node --test artifacts/api-server/hardening.test.js artifacts/gosie-mobile/server/serve.test.js
