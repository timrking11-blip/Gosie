name: Gosie web checks

on:
  pull_request:
    paths:
      - "artifacts/gosie/**"
      - "artifacts/gosie-week-ahead/**"
      - "design-system/gosie-week-ahead/**"
      - "artifacts/api-server/**"
      - "artifacts/gosie-mobile/**"
      - "lib/api-client-react/**"
      - "lib/community/**"
      - "research/gosie/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/gosie-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gosie-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install locked web and mobile hook-test dependencies
        run: pnpm --filter @workspace/gosie... --filter @workspace/gosie-mobile... install --frozen-lockfile
      - name: Load configured build environment
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          env = tomllib.loads(Path("artifacts/gosie/.replit-artifact/artifact.toml").read_text())["services"][0]["env"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for name in ("PORT", "BASE_PATH"):
                  output.write(f"{name}={env[name]}\n")
          PY
      - name: Typecheck
        run: pnpm --filter @workspace/gosie typecheck
      - name: Typecheck mobile integration
        run: pnpm --filter @workspace/gosie-mobile typecheck
      - name: Existing and product regression tests
        run: pnpm --filter @workspace/gosie test
      - name: Dev-server private-file access checks
        run: pnpm --filter @workspace/gosie test:dev-server
      - name: Configured production build
        run: pnpm --filter @workspace/gosie build
      - name: Release privacy check
        env:
          GOSIE_PRODUCTION_URL: ${{ vars.GOSIE_PRODUCTION_URL }}
        run: pnpm --filter @workspace/gosie check:release-privacy
      - name: Install production server dependencies
        run: pnpm --filter @workspace/api-server... install --frozen-lockfile
      - name: Production static serving and API route smoke tests
        run: node --test artifacts/api-server/production-server.test.js
      - name: Mobile static-server security regressions
        run: node --test artifacts/gosie-mobile/server/serve.test.js

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gosie_test
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: gosie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gosie_test -d gosie_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gosie_test:ci-disposable-only@127.0.0.1:5432/gosie_test
      GOSIE_DB_ENV: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install locked API dependencies
        run: pnpm --filter @workspace/api-server... install --frozen-lockfile
      - name: Apply schema to disposable CI database
        run: node artifacts/api-server/apply-schema.js
      - name: API security, ownership, portability, and restart regressions
        run: pnpm --filter @workspace/api-server test
      - name: Public research fixtures and approved catalog safety
        run: node --test research/gosie/*.test.cjs artifacts/api-server/research-catalog.test.js

  week-ahead:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install locked Week Ahead dependencies
        run: pnpm --filter @workspace/gosie-week-ahead... install --frozen-lockfile
      - name: Typecheck Week Ahead
        run: pnpm --filter @workspace/gosie-week-ahead typecheck
      - name: Load configured Week Ahead build environment
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          env = tomllib.loads(Path("artifacts/gosie-week-ahead/.replit-artifact/artifact.toml").read_text())["services"][0]["env"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for name in ("PORT", "BASE_PATH"):
                  output.write(f"{name}={env[name]}\n")
          PY
      - name: Build Week Ahead
        run: pnpm --filter @workspace/gosie-week-ahead build
