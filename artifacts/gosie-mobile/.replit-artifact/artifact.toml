kind = "mobile"
previewPath = "/mobile/"
title = "Gosie Mobile"
description = "A native-feeling mobile companion for exploring Gosie's illustrative Week Ahead and Weekend Ahead concepts."
version = "1.0.0"
id = "artifacts/gosie-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 21101

[services.development]
run = "pnpm --filter @workspace/gosie-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gosie-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/gosie-mobile", "run", "serve" ]

[services.env]
PORT = "21101"
BASE_PATH = "/mobile/"
