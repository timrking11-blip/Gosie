kind = "web"
previewPath = "/"
title = "Gosie"
description = "Gosie's illustrative promotional website and private planning-pilot application. Pilot signups remain closed pending release approval."
version = "1.0.0"
id = "artifacts/gosie"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23967

[services.development]
run = "pnpm --filter @workspace/gosie run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gosie", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/gosie", "run", "serve" ]

[services.env]
PORT = "23967"
BASE_PATH = "/"
